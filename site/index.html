<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HMNL Statistika</title>
  <link rel="icon" type="image/png" href="/hmnl-avatar.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#10203a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#070d17" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HMNL">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;700;900&family=Roboto:wght@400;500;700&display=swap">
</head>
<body>
  <!-- uvodni ekran dok se učitava aplikacija; React ga zamijeni čim se pokrene -->
  <div id="app"><div class="boot" role="status" aria-label="Učitavam"><img src="/icon-192.png" width="72" height="72" alt=""><i></i></div></div>
  <style>
    .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 20px; background: #e9edf1; }
    .boot img { border-radius: 16px; box-shadow: 0 6px 24px rgba(16, 32, 58, .25); animation: bootP 1.1s ease-in-out infinite alternate; }
    .boot i { width: 112px; height: 3px; border-radius: 2px; background: rgba(35, 80, 184, .15) linear-gradient(90deg, transparent, #2350b8, transparent) no-repeat; background-size: 45% 100%; animation: bootB 1s linear infinite; }
    @keyframes bootP { to { transform: scale(.95); opacity: .75; } }
    @keyframes bootB { from { background-position: -60% 0; } to { background-position: 160% 0; } }
    @media (prefers-color-scheme: dark) { .boot { background: #0b1320; } .boot i { background-color: rgba(120, 160, 245, .15); background-image: linear-gradient(90deg, transparent, #78a0f5, transparent); } }
    @media (prefers-reduced-motion: reduce) { .boot img, .boot i { animation: none; } }
  </style>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
